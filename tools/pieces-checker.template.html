<title>FAB Piece Checker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* Layout: 3D table on the left, piece list / details / export panel on the right (stacks under the table on phones). */
:root {
  --bg: #eef0ee; --panel: #fbfbf9; --panel-2: #f1f2ef; --line: #cfd3cc; --fg: #1d2420; --muted: #5d675f;
  --accent: #c2410c; --accent-fg: #ffffff; --ok: #1a7f4b; --bad: #c0262d; --warn: #9a6700; --sel: #0a84ff;
  --ui: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131714; --panel: #1b201c; --panel-2: #232924; --line: #343b35; --fg: #e8ece6; --muted: #9aa59c;
  --accent: #ff9248; --accent-fg: #1b1006; --ok: #4cc38a; --bad: #ff6b72; --warn: #e5b53b; --sel: #4aa3ff; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #131714; --panel: #1b201c; --panel-2: #232924; --line: #343b35; --fg: #e8ece6; --muted: #9aa59c;
  --accent: #ff9248; --accent-fg: #1b1006; --ok: #4cc38a; --bad: #ff6b72; --warn: #e5b53b; --sel: #4aa3ff; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 15px; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 380px; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.stage { position: relative; min-width: 0; min-height: 0; background: #0c0f0d; overflow: hidden; }
#gl { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
.bar { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
.bar > * { pointer-events: auto; }
.chip { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(6px); }
.chip[hidden] { display: none; }
.readout { position: absolute; left: 10px; bottom: 10px; right: 10px; font-family: var(--mono); font-size: 12px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.nogl { position: absolute; inset: 0; display: grid; place-items: center; color: #cfd; text-align: center; padding: 20px; }
.panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; padding: 11px 6px; background: none; border: 0; border-bottom: 3px solid transparent; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected=true] { color: var(--fg); border-bottom-color: var(--accent); }
.pane { padding: 12px 14px 20px; overflow: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
h2 { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
h3 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.15; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 600; }
.btn.danger { color: var(--bad); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--panel-2); padding: 6px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.muted { color: var(--muted); } .mono { font-family: var(--mono); }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 10px; align-items: center; }
.kv label { color: var(--muted); font-size: 13px; }
input[type=number], input[type=text], input[type=search], select, textarea { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
textarea { min-height: 64px; resize: vertical; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.filters .wide { grid-column: 1 / -1; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.cell { position: relative; background: var(--panel-2); border: 2px solid transparent; border-radius: 6px; padding: 4px; cursor: pointer; display: flex; flex-direction: column; gap: 3px; align-items: center; min-width: 0; }
.cell img { width: 100%; height: 64px; object-fit: contain; display: block; }
.cell span { font-size: 11.5px; line-height: 1.15; text-align: center; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--mono); }
.cell[aria-selected=true] { border-color: var(--sel); }
.cell .st { position: absolute; top: 3px; right: 3px; width: 11px; height: 11px; border-radius: 50%; }
.st.ok { background: var(--ok); } .st.bad { background: var(--bad); }
.cp { position: absolute; left: 3px; top: 3px; font-family: var(--mono); font-size: 11px; font-weight: 600; background: var(--accent); color: var(--accent-fg); border-radius: 4px; padding: 0 5px; }
.chip[hidden] { display: none; }
.pq { display: inline-flex; align-items: center; gap: 4px; }
.dotq { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid #fff; box-shadow: 0 0 0 1px #0007; display: inline-block; }
.dotq.elite { background: #e5383b; } .dotq.veteran { background: #111; } .dotq.green { background: #fff; border-color: #333; box-shadow: none; }
.hint { font-size: 13px; color: var(--muted); line-height: 1.4; }
#out { font-family: var(--mono); font-size: 11.5px; min-height: 160px; white-space: pre; }
.list { display: flex; flex-direction: column; gap: 2px; }
.item { display: flex; gap: 8px; align-items: baseline; padding: 5px 7px; border-radius: 6px; background: none; border: 0; text-align: left; width: 100%; cursor: pointer; }
.item:hover { background: var(--panel-2); }
.tag { font-family: var(--mono); font-size: 11.5px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); flex: none; }
.pass { color: var(--ok); border-color: var(--ok); } .fail { color: var(--bad); border-color: var(--bad); }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 52%) minmax(0, 48%); padding-left: 0; padding-right: 0; }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .pane { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .bar { left: max(10px, env(safe-area-inset-left, 0px)); }
}
</style>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="gl" aria-label="3D table with game pieces"></canvas>
    <div class="bar">
      <div class="chip seg" style="padding:0" role="group" aria-label="View">
        <button id="v-one" aria-pressed="true">Single piece</button><button id="v-tab" aria-pressed="false">Table</button>
      </div>
      <div class="chip" id="stepchip" hidden></div>
      <div class="chip" id="facechip" hidden></div>
    </div>
    <div class="readout" id="readout">Drag to orbit, scroll or pinch to zoom, right-drag or Shift-drag to pan.</div>
  </div>
  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-list" aria-selected="true">Pieces</button>
      <button role="tab" id="tab-det" aria-selected="false">Details</button>
      <button role="tab" id="tab-exp" aria-selected="false">Export</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
</div>

<script>
const PIECES = __DATA__;
const IMGS = __IMGS__;
(function () {
'use strict';
const $ = (s) => document.querySelector(s);
const pane = $('#pane');
const clone = (o) => JSON.parse(JSON.stringify(o));

        const keys = op.t === 'block' ? ['name', 'side', 'ech', 'cls', 'q', 'start_area', 'arrival_turn', 'entry'] : ['name', 'kind', 'ech', 'turn', 'quality'];
        keys.forEach((k) => { if (op[k] !== undefined) np[k] = op[k]; }); } } }
} catch (e) {}
const save = () => { try { localStorage.setItem(STORE, JSON.stringify({ pieces, flags, notes })); } catch (e) {} };
const byId = (id) => pieces.find((p) => p.id === id);
const ECH = { de_5pz: '5th Panzer Army (grey)', de_6pz: '6th Panzer Army (purple)', de_7a: '7th Army (blue)', de_sr: 'German Strategic Reserve (orange)', us_1a: 'US 1st Army (light green)', us_3a: 'US 3rd Army (dark green)', us_sr: 'US Strategic Reserve (light blue)', br_xxx: 'British XXX Corps (red-orange)', german: 'German (no army)', allied: 'Allied (no army)', none: 'Neutral marker' };
const WOOD = { german: 0x8d9195, british: 0x3f6fb8, us: 0x55803c, allied: 0x55803c };
let mode = 'one', tab = 'list', selId = pieces[0].id, step = 0, faceBack = false;
const F = { side: 'all', type: 'all', ech: 'all', limit: 'all', q: '' };

/* ---------- three.js ---------- */
const canvas = $('#gl'); let renderer = null;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); } catch (e) { renderer = null; }
if (!renderer) { const d = document.createElement('div'); d.className = 'nogl'; d.textContent = 'This browser could not start WebGL, so the 3D view is unavailable. The Pieces and Details tabs still work.'; $('#stage').appendChild(d); }
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0c0f0d);
const cam = new THREE.PerspectiveCamera(35, 1, 0.1, 200);
let target = new THREE.Vector3(0, 0.6, 0), yaw = 0.35, pitch = 0.42, dist = 4.2;
if (renderer) { renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1)); renderer.outputEncoding = THREE.sRGBEncoding; renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; }
scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x2a2f2a, 0.85));
const sun = new THREE.DirectionalLight(0xffffff, 0.9); sun.position.set(3, 6, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -14, right: 14, top: 14, bottom: -14, near: 0.5, far: 30 }); scene.add(sun);
const table = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), new THREE.MeshStandardMaterial({ color: 0x1d3a2a, roughness: 0.95 })); table.rotation.x = -Math.PI / 2; table.receiveShadow = true; scene.add(table);
const stage = new THREE.Group(); scene.add(stage);
const texCache = {}, meshCache = {};
const loader = new THREE.TextureLoader();
function tex(i) { if (!texCache[i]) { const t = loader.load(IMGS[i], () => requestRender()); t.encoding = THREE.sRGBEncoding; t.anisotropy = renderer ? renderer.capabilities.getMaxAnisotropy() : 1; texCache[i] = t; } return texCache[i]; }
const btCache = {};
function backTex(i) { if (!btCache[i]) { const t = loader.load(IMGS[i], () => requestRender()); t.center.set(0.5, 0.5); t.rotation = Math.PI; t.encoding = THREE.sRGBEncoding; btCache[i] = t; } return btCache[i]; }
function pieceMesh(p) {
  if (meshCache[p.id]) return meshCache[p.id];
  let m;
  if (p.t === 'block') {
    const w = 1, h = p.ar, d = 0.3, wood = new THREE.MeshStandardMaterial({ color: WOOD[p.side] || 0x888888, roughness: 0.7 });

    const s = 1, d = 0.12, edge = new THREE.MeshStandardMaterial({ color: 0xd8d4c8, roughness: 0.8 });
    const bp = p.back ? pieces.find((x) => x.id === p.back) : null;
    const front = new THREE.MeshStandardMaterial({ map: tex(p.img), roughness: 0.5 }), back = bp ? new THREE.MeshStandardMaterial({ map: backTex(bp.img), roughness: 0.5 }) : (p.t === 'back' ? front : new THREE.MeshStandardMaterial({ color: 0xb9b4a6, roughness: 0.8 }));

}
const outline = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1, 1, 1)), new THREE.LineBasicMaterial({ color: 0xffd400 }));
function visiblePieces() {
  const q = F.q.trim().toLowerCase();
  return pieces.filter((p) => (F.side === 'all' || p.side === F.side) && (F.type === 'all' || p.t === F.type || p.kind === F.type) && (F.ech === 'all' || p.ech === F.ech) && (F.limit === 'all' || p.limit === F.limit) &&
    (!q || (p.name + ' ' + p.id + ' ' + (p.kind || '')).toLowerCase().includes(q)));
}
let anim = null, rotCur = 0, rotGoal = 0, dirty = true, rotX = 0, rotXGoal = 0;
const flatX = () => (faceBack ? Math.PI / 2 : -Math.PI / 2);
function requestRender() { dirty = true; }
function blockAngle(p, st) { return Math.PI / 2 * (p.steps - st); }
function standY(m, ang) { const [w, h] = m.userData.dims; return Math.abs(Math.cos(ang)) * h / 2 + Math.abs(Math.sin(ang)) * w / 2; }
function layout() {
  while (stage.children.length) stage.remove(stage.children[0]);
  outline.parent && outline.parent.remove(outline);
  const sel = byId(selId);
  if (mode === 'one') {
    const m = pieceMesh(sel); stage.add(m);

    list.forEach((p, i) => { const m = pieceMesh(p); stage.add(m); const c = i % cols, r = Math.floor(i / cols);

  const m = meshCache[selId]; if (m && m.parent) { const [w, h, d] = m.userData.dims; outline.scale.set(w * 1.04, h * 1.04, d * 1.04); m.add(outline); }
  requestRender();
}
function setStep(k) { const p = byId(selId); if (p.t !== 'block') return; step = k; rotGoal = blockAngle(p, k); anim = true; requestRender(); updateStepChip(); renderDetailsLive(); }
function frame() {
  requestAnimationFrame(frame); if (!renderer) return;
  if (anim && mode === 'one') { const p = byId(selId), m = meshCache[selId]; if (p.t === 'block') { const d = rotGoal - rotCur; if (Math.abs(d) < 0.002) { rotCur = rotGoal; anim = null; } else rotCur += d * 0.18; m.rotation.z = rotCur; m.position.y = standY(m, rotCur); dirty = true; } else { const d = rotXGoal - rotX; if (Math.abs(d) < 0.003) { rotX = rotXGoal; anim = null; } else rotX += d * 0.16; m.rotation.x = rotX; m.position.y = 0.06 + 0.5 * Math.abs(Math.sin(Math.min(Math.PI, Math.abs(d)))); dirty = true; } }

  const r = canvas.getBoundingClientRect(); if (canvas.width !== Math.round(r.width * renderer.getPixelRatio()) || canvas.height !== Math.round(r.height * renderer.getPixelRatio())) { renderer.setSize(r.width, r.height, false); cam.aspect = r.width / Math.max(1, r.height); cam.updateProjectionMatrix(); }

/* camera input */
const ptrs = new Map(); let moved = 0, lastPinch = 0, panning = false;

  else { yaw -= dx * 0.008; pitch = Math.min(1.5, Math.max(0.03, pitch + dy * 0.008)); }
  requestRender(); });
const ray = new THREE.Raycaster();
function endp(e) { const wasClick = moved < 6 && ptrs.size === 1; ptrs.delete(e.pointerId); lastPinch = 0;
  if (wasClick && e.type === 'pointerup' && mode === 'tab') { const r = canvas.getBoundingClientRect(); ray.setFromCamera(new THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1), cam);

canvas.addEventListener('wheel', (e) => { e.preventDefault(); dist = Math.min(60, Math.max(1.5, dist * Math.exp(e.deltaY * 0.0012))); requestRender(); }, { passive: false });

  const hit = ray.intersectObjects(stage.children, false)[0]; if (hit) { const p = byId(hit.object.userData.id); $('#readout').textContent = p.id + ' · ' + p.name + ' · ' + sub(p); } });

/* ---------- UI ---------- */
function sub(p) { return p.t === 'block' ? (p.cls + ' · ' + p.steps + ' step' + (p.steps > 1 ? 's' : '') + ' · ' + (ECH[p.ech] || p.ech)) : (p.t === 'back' ? (p.kind.replace(/_/g, ' ') + ' · ' + p.copies + ' copies · ' + p.limit) : (p.kind + ' · turn ' + (p.turn == null ? '-' : p.turn) + ' · ' + (ECH[p.ech] || p.ech) + (p.copies > 1 || p.limit === 'unlimited' ? ' · ' + p.copies + ' cop' + (p.copies > 1 ? 'ies' : 'y') + ', ' + p.limit : ''))); }

  c.innerHTML = '<span class="muted">Face up</span><span class="seg"><button data-f="front" aria-pressed="' + !faceBack + '">Front</button><button data-f="back" aria-pressed="' + faceBack + '">Back</button></span>';

function field(label, html) { return '<label>' + label + '</label><div>' + html + '</div>'; }

function renderDetailsLive() { const p = byId(selId), el = $('#live'); if (!el || p.t !== 'block') return; const k = step || p.steps, q = p.q[k - 1];

function diff() {
  const out = [];

    const cmp = (n, a, b) => { if (JSON.stringify(a) !== JSON.stringify(b)) ch.push(n + ': ' + JSON.stringify(b) + ' → ' + JSON.stringify(a)); };

    if (p.t === 'block') { cmp('class', p.cls, o.cls); cmp('quality by step', p.q, o.q); cmp('start area', p.start_area, o.start_area); cmp('arrival turn', p.arrival_turn, o.arrival_turn); cmp('entry', p.entry, o.entry); }
    else if (p.t === 'back') { cmp('copies', p.copies, o.copies); cmp('limit', p.limit, o.limit); }
    else { cmp('kind', p.kind, o.kind); cmp('turn', p.turn, o.turn); cmp('quality', p.quality, o.quality); cmp('copies', p.copies, o.copies); cmp('limit', p.limit, o.limit); }

function renderExp() {
  const ch = diff(), bad = Object.entries(flags).filter(([, v]) => v === 'bad').map(([k]) => k), nn = Object.keys(notes).length, ok = Object.values(flags).filter((v) => v === 'ok').length;

function setMode(m) { mode = m; if (m === 'tab') { yaw = 0.0; pitch = 0.75; } $('#v-one').setAttribute('aria-pressed', m === 'one'); $('#v-tab').setAttribute('aria-pressed', m === 'tab'); if (m === 'one' && byId(selId).t === 'block') step = byId(selId).steps; if (m === 'one') { yaw = 0.35; pitch = 0.42; } layout(); updateStepChip(); }
