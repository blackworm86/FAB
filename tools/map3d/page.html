<title>Ardennes Relief</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: the relief fills the screen; a title plate top-left, one control bar at the bottom (wraps on phones). Single dark look, the game's own palette. */
:root { --ink: #0b0d08; --panel: #12150ef2; --line: #3a3e2c; --fg: #ddd7b5; --mute: #8d9065; --gold: #e7b04a;
  --disp: 'Saira Condensed', 'Arial Narrow', sans-serif; --mono: 'JetBrains Mono', ui-monospace, monospace; color-scheme: dark; }
html, body { height: 100%; } body { background: var(--ink); color: var(--fg); font: 13px/1.4 var(--mono); overflow: hidden; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.plate { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); background: var(--panel); border: 1px solid var(--line); padding: 10px 14px; max-width: min(360px, calc(100% - 32px)); }
.plate h1 { margin: 0; font: 700 22px/1 var(--disp); letter-spacing: .06em; text-transform: uppercase; text-wrap: balance; }
.plate p { margin: 4px 0 0; color: var(--mute); font-size: 11.5px; }
.plate b { color: var(--gold); font-weight: 600; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; justify-content: center; background: var(--panel); border-top: 1px solid var(--line);
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.grp { display: flex; align-items: center; gap: 8px; min-width: 0; }
.grp > span { font: 600 11px var(--disp); letter-spacing: .14em; text-transform: uppercase; color: var(--mute); }
.seg { display: flex; border: 1px solid var(--line); }
.seg button, .tog { background: transparent; color: var(--fg); border: 0; font: 600 13px var(--disp); letter-spacing: .08em; text-transform: uppercase; padding: 8px 11px; min-height: 36px; cursor: pointer; }
.seg button { white-space: nowrap; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--gold); color: var(--ink); }
.tog { border: 1px solid var(--line); display: flex; gap: 7px; align-items: center; }
.tog::before { content: ""; width: 10px; height: 10px; border: 1px solid var(--mute); }
.tog[aria-pressed="true"]::before { background: var(--gold); border-color: var(--gold); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
input[type=range] { width: 120px; height: 36px; margin: 0; accent-color: var(--gold); }
#more { display: none; } .grp.tg { flex-wrap: wrap; justify-content: center; }
#more::before { content: none; } #more::after { content: "▴"; font-size: 10px; } #more[aria-expanded="true"]::after { content: "▾"; } #more[aria-expanded="true"] { border-color: var(--gold); color: var(--gold); }
#zv { min-width: 3.5ch; font-variant-numeric: tabular-nums; color: var(--gold); }
.hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--barh, 70px) + 12px); background: var(--panel); border: 1px solid var(--gold); padding: 7px 12px; font-size: 12px; max-width: calc(100% - 32px); text-align: center; pointer-events: none; }
.hint b { color: var(--gold); }
/* phones and short landscape screens: one compact row (Look + Options); the other controls open above it on demand */
@media (max-width: 560px), (max-height: 500px) {
  .plate { padding: 7px 10px; } .plate h1 { font-size: 17px; } .plate .long { display: none; } .plate p { font-size: 10.5px; margin-top: 2px; }
  .hint { bottom: auto; top: var(--pb, 70px); font-size: 11px; padding: 5px 9px; }
  .bar { gap: 8px 10px; padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
  .bar .opt { display: none; } .bar.open .opt { display: flex; } .bar .opt { flex-basis: 100%; justify-content: center; }
  #more { display: flex; } .grp > span.lk { display: none; }
  .seg button, .tog { padding: 7px 10px; font-size: 12.5px; min-height: 40px; } input[type=range] { width: 130px; }
}
@media (max-width: 360px) { #more .mt { display: none; } #more::after { font-size: 13px; } #more { min-width: 42px; justify-content: center; } .seg button, .tog { padding: 7px 8px; font-size: 11.5px; white-space: nowrap; } .bar { gap: 8px 6px; } }
@media (max-height: 500px) { .hint { top: calc(12px + env(safe-area-inset-top, 0px)); left: auto; right: max(16px, env(safe-area-inset-right, 0px)); transform: none; max-width: 42%; } .bar .opt { flex-basis: auto; } }
</style>

<canvas id="c" aria-label="3D relief of the St. Vith and Malmedy area of the game map"></canvas>
<div class="plate"><h1>Ardennes Relief</h1><p><span class="long">Mockup · St. Vith – Malmedy · real elevation bent onto the game map. </span><b>Drag</b> to move, <b>pinch<span class="long"> / wheel</span></b> to zoom, <b>two fingers<span class="long"> / right-drag</span></b> to tilt.</p></div>

  <div class="grp"><span class="lk">Look</span><div class="seg" id="look"><button id="lk-paint" data-v="1" aria-pressed="true">Low-poly</button><button id="lk-iso" data-v="2" aria-pressed="false">Contours</button><button id="lk-board" data-v="0" aria-pressed="false">Board</button></div><button class="tog" id="more" aria-expanded="false" aria-controls="bar" aria-label="Options"><span class="mt">Options</span></button></div>
  <div class="grp opt"><span>Facets</span><div class="seg" id="fac"><button id="fc-s" data-v="2" aria-pressed="false">Small</button><button id="fc-m" data-v="3" aria-pressed="true">Medium</button><button id="fc-l" data-v="5" aria-pressed="false">Large</button></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const D = /*DATA*/null;
const { meta } = D, C = meta.cols, R = meta.rows, ST = meta.step, X0 = meta.x0, Y0 = meta.y0, MW = meta.w, MH = meta.h, CX = X0 + MW / 2, CY = Y0 + MH / 2;
const dec = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const HB = new Uint16Array(dec(D.h).buffer), FL = dec(D.f), M_PER_PX = 80;
// height in "map pixels" above the lowest point (1 map px ≈ 80 m), bilinear on the 2 px grid
const hAt = (x, y) => { let gx = Math.min(Math.max((x - X0) / ST, 0), C - 1.001), gy = Math.min(Math.max((y - Y0) / ST, 0), R - 1.001); const i = gx | 0, j = gy | 0, fx = gx - i, fy = gy - j, g = (a, b) => HB[b * C + a];
  return ((g(i, j) * (1 - fx) + g(i + 1, j) * fx) * (1 - fy) + (g(i, j + 1) * (1 - fx) + g(i + 1, j + 1) * fx) * fy) / 65535 * (meta.hi - meta.lo) / M_PER_PX; };
const flagAt = (x, y) => FL[Math.min(R - 1, Math.max(0, Math.round((y - Y0) / ST))) * C + Math.min(C - 1, Math.max(0, Math.round((x - X0) / ST)))];
const rnd = (() => { let s = 7; return () => ((s = (s * 16807) % 2147483647) / 2147483647); })();
const hash = (a, b) => { const s = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return s - Math.floor(s); };

const canvas = document.getElementById('c'), renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0b0d08); scene.fog = new THREE.Fog(0x0b0d08, 1500, 2600);
window.cam = new THREE.PerspectiveCamera(40, 1, 5, 4000);
const ctl = window.ctl = new THREE.OrbitControls(cam, canvas);
ctl.screenSpacePanning = false; ctl.enableDamping = true; ctl.maxPolarAngle = 1.25; ctl.minDistance = 60; ctl.maxDistance = 2200;
ctl.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
ctl.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_ROTATE };
const SUN = new THREE.Vector3(-0.55, 0.78, -0.45).normalize();
scene.add(new THREE.AmbientLight(0xffffff, 0.62)); const dl = new THREE.DirectionalLight(0xffffff, 0.55); dl.position.copy(SUN); scene.add(dl);

const loadTex = (src) => { const t = new THREE.TextureLoader().load(src); t.anisotropy = renderer.capabilities.getMaxAnisotropy(); return t; };
const hlCv = document.createElement('canvas'); hlCv.width = MW * 2; hlCv.height = MH * 2; const hlTex = new THREE.CanvasTexture(hlCv);
const U = { tP: { value: loadTex('__PRINTED__') }, tO: { value: loadTex('__OVERLAY__') }, tH: { value: hlTex }, uMode: { value: 1 }, uHl: { value: 0 }, uZ: { value: 4 }, uSun: { value: SUN }, uLo: { value: meta.lo }, uCont: { value: 1 }, tF: { value: null } };
const mat = new THREE.ShaderMaterial({ uniforms: U, transparent: true, extensions: { derivatives: true },
  vertexShader: `attribute vec3 fcol; attribute vec2 grad; uniform float uZ,uLo; varying vec3 vCol; varying vec2 vUv; varying vec3 vW; varying float vM; varying vec2 vG;
    void main(){ vec3 p=position; vM=p.y*80.+uLo; vG=grad; p.y*=uZ; vUv=uv; vCol=fcol; vec4 w=modelMatrix*vec4(p,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
  fragmentShader: `uniform sampler2D tP,tO,tH; uniform float uMode,uHl,uCont; uniform vec3 uSun; varying vec3 vCol; varying vec2 vUv; varying vec3 vW; varying float vM; varying vec2 vG; uniform sampler2D tF; uniform float uZ;
    float iso(float step,float w){ float c=vM/step, d=abs(fract(c+.5)-.5)/max(fwidth(c),1e-4); return 1.-clamp(d-w,0.,1.); }
    void main(){
      if(uMode>1.5){                                            /* contour look: the snow map draped on a smooth relief, drawn with fine contour lines */
        vec3 g=texture2D(tF,vUv).rgb; vec3 n=normalize(vec3(-vG.x*uZ,1.,-vG.y*uZ));
        vec3 base=g*clamp(1.+.55*(dot(n,uSun)-uSun.y),.72,1.12);                 /* soft, smooth light: shape without facets */
        float wood=clamp((.93-g.r)/.3,0.,1.); vec3 lc=mix(vec3(.42,.52,.66),vec3(.16,.38,.24),wood);
        float c1=vM/25., f1=fwidth(c1), m1=(1.-clamp(abs(fract(c1+.5)-.5)/max(f1,1e-4),0.,1.))*smoothstep(2.5,7.,1./max(f1,1e-4));   /* 25 m: hairline, fades out where lines crowd */
        float c2=vM/100., f2=fwidth(c2), m2=(1.-clamp(abs(fract(c2+.5)-.5)/max(f2,1e-4)-.3,0.,1.))*smoothstep(2.,5.,1./max(f2,1e-4));
        base=mix(base,lc,max(m1*.32,m2*.58));
        vec4 h=texture2D(tH,vUv); base=mix(base,h.rgb,h.a*uHl);
        vec4 o=texture2D(tO,vUv); base=mix(base,o.rgb,o.a);
        gl_FragColor=vec4(base,1.); return; }   /* lit areas stay see-through so the contours show */
      vec3 n=normalize(cross(dFdx(vW),dFdy(vW))); if(n.y<0.) n=-n;
      vec3 base = uMode<.5 ? mix(texture2D(tP,vUv).rgb,vec3(.95,.96,.98),.45) : vCol;   /* the printed board under a layer of snow */
      float l=1.+.75*(max(dot(n,uSun),0.)-uSun.y);           /* flat ground keeps its colour; slopes to the sun lighter, away darker */
      base*=clamp(l,.5,1.3);
      base=mix(base,vec3(.30,.36,.45),max(iso(25.,.15)*.32,iso(100.,.7)*.6)*uCont);   /* contours every 25 m, index line every 100 m */
      vec4 h=texture2D(tH,vUv); base=mix(base,h.rgb,h.a*uHl);
      vec4 o=texture2D(tO,vUv); base=mix(base,o.rgb,o.a);     /* borders, roads, rivers, numbers and names always on top */
      gl_FragColor=vec4(base,1.); }` });

// painted palette: fields in a soft patchwork, woods, water, high moor
// winter, December 1944: snow on the fields, dark snow-dusted forest floor, grey slush in the towns
const PAL = { field: [[0.93, 0.95, 0.97], [0.90, 0.93, 0.96], [0.95, 0.96, 0.98], [0.88, 0.91, 0.95]], wood: [[0.42, 0.48, 0.47], [0.38, 0.44, 0.43], [0.46, 0.52, 0.51]], water: [0.29, 0.52, 0.74], moor: [0.97, 0.98, 0.99], paved: [0.74, 0.74, 0.75] };
const paved = (x, y) => D.towns.some(([tx, ty]) => Math.hypot(x - tx, y - ty) < 9) || D.cities.some((c) => c.cells.some(([cx, cy]) => Math.abs(x - cx) < 4 && Math.abs(y - cy) < 4));
let terrain = null;
function buildTerrain(step, smooth) {
  if (terrain) { scene.remove(terrain); terrain.geometry.dispose(); }
  const cell = ST * step, nx = Math.floor(MW / cell), ny = Math.floor(MH / cell), P = [];
  for (let j = 0; j <= ny; j++) for (let i = 0; i <= nx; i++) {               // jitter inner vertices so the facets look hand-cut, not gridded
    const edge = smooth || i === 0 || j === 0 || i === nx || j === ny, jx = edge ? 0 : (hash(i, j) - 0.5) * 0.7 * cell, jy = edge ? 0 : (hash(j + 9, i) - 0.5) * 0.7 * cell;
    const x = X0 + Math.min(i * cell, MW) + jx, y = Y0 + Math.min(j * cell, MH) + jy; P.push([x, y, hAt(x, y)]);
  }
  const pos = [], uv = [], col = [], grd = [];
  const tri = (a, b, c) => { const mx = (a[0] + b[0] + c[0]) / 3, my = (a[1] + b[1] + c[1]) / 3, f = flagAt(mx, my), w = (f >> 2) / 63, k = hash(Math.floor(mx / 23), Math.floor(my / 19));
    const hm = (a[2] + b[2] + c[2]) / 3 * M_PER_PX + meta.lo;
    let cc = paved(mx, my) ? PAL.paved : w > 0.45 ? PAL.wood[(k * 3) | 0] : hm > 560 ? PAL.moor : PAL.field[(k * 4) | 0];
    const v = 0.96 + hash(mx, my) * 0.08;
    for (const p of [a, b, c]) { grd.push((hAt(p[0] + 1, p[1]) - hAt(p[0] - 1, p[1])) / 2, (hAt(p[0], p[1] + 1) - hAt(p[0], p[1] - 1)) / 2); pos.push(p[0] - CX, p[2], p[1] - CY); uv.push((p[0] - X0) / MW, 1 - (p[1] - Y0) / MH); col.push(cc[0] * v, cc[1] * v, cc[2] * v); } };
  for (let j = 0; j < ny; j++) for (let i = 0; i < nx; i++) {
    const a = P[j * (nx + 1) + i], b = P[j * (nx + 1) + i + 1], c = P[(j + 1) * (nx + 1) + i], d = P[(j + 1) * (nx + 1) + i + 1];
    if ((i + j) % 2) { tri(a, c, b); tri(b, c, d); } else { tri(a, c, d); tri(a, d, b); }
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2)); g.setAttribute('fcol', new THREE.Float32BufferAttribute(col, 3)); g.setAttribute('grad', new THREE.Float32BufferAttribute(grd, 2));
  terrain = new THREE.Mesh(g, mat); scene.add(terrain);
  // a dark plinth under the cut edges so the region reads as a piece of terrain
}
const plinth = new THREE.Mesh(new THREE.BoxGeometry(MW, 6, MH), new THREE.MeshLambertMaterial({ color: 0x2a2d20 })); plinth.position.y = -3.2; scene.add(plinth);

// trees in the woods, houses around each town symbol (instanced, low-poly)
const props = new THREE.Group(); scene.add(props);
const treeSpots = [], houseSpots = [], churches = [];
const cityCell = new Set(); for (const c of D.cities) for (const [x, y] of c.cells) cityCell.add(((x / 4) | 0) + ',' + ((y / 4) | 0));
const inTown = (x, y) => D.towns.some(([tx, ty]) => Math.hypot(x - tx, y - ty) < 15) || [-1, 0, 1].some((a) => [-1, 0, 1].some((b) => cityCell.has(((x / 4 | 0) + a * 2) + ',' + ((y / 4 | 0) + b * 2))));
const nearLabel = (x, y) => D.areas.some((a) => Math.abs(x - a.label[0]) < 48 && y - a.label[1] > -34 && y - a.label[1] < 22);   // keep the printed number and name clear
for (let j = 0; j < R; j++) for (let i = 0; i < C; i++) { const f = FL[j * C + i], w = (f >> 2) / 63; const X = X0 + i * ST, Y = Y0 + j * ST; if (!(f & 2) && w > 0.3 && rnd() < w * 0.13 && !nearLabel(X, Y) && !inTown(X, Y)) treeSpots.push([X0 + i * ST + (rnd() - 0.5) * ST, Y0 + j * ST + (rnd() - 0.5) * ST, 0.75 + rnd() * 0.6, rnd()]); }
// house: [x, y, turn, width, height, length]
for (const [x, y] of D.towns) {                                   // a town: a small square, a church and a ring of houses
  churches.push([x + 1, y - 1, 1]);
  for (let k = 0; k < 9; k++) { const a = k / 9 * 6.283 + rnd() * 0.4, r = 5.5 + rnd() * 3.5; houseSpots.push([x + Math.cos(a) * r, y + Math.sin(a) * r, -a, 2.4 + rnd() * 0.6, 2 + rnd() * 0.8, 3.2 + rnd() * 0.8]); }
}
for (const c of D.cities) {                                       // a city: its printed footprint built up, taller in the middle, two churches, suburbs around
  const far = Math.max(...c.cells.map(([x, y]) => Math.hypot(x - c.c[0], y - c.c[1]))) || 1;
  for (const [x, y] of c.cells) { const t = 1 - Math.hypot(x - c.c[0], y - c.c[1]) / far;
    houseSpots.push([x + (rnd() - .5) * .6, y + (rnd() - .5) * .6, (rnd() < .5 ? 0 : 1.571), 3.3, 2.6 + t * 4 + rnd() * 1.5, 3.4]); }
  churches.push([c.c[0], c.c[1], 1.6]); const [fx, fy] = c.cells[(c.cells.length * 0.3) | 0]; churches.push([fx, fy, 1.2]);
  for (let k = 0; k < 16; k++) { const a = rnd() * 6.283, r = far + 4 + rnd() * 7; houseSpots.push([c.c[0] + Math.cos(a) * r, c.c[1] + Math.sin(a) * r, -a, 2.6, 2.2 + rnd(), 3.4]); }
}
const treeGeo = new THREE.ConeGeometry(2.1, 6, 5); treeGeo.translate(0, 3, 0);
const capGeo = new THREE.ConeGeometry(1.25, 3.0, 5); capGeo.translate(0, 4.6, 0);   // snow on the upper branches
const trees = new THREE.InstancedMesh(treeGeo, new THREE.MeshLambertMaterial({}), treeSpots.length);
treeSpots.forEach((t, k) => trees.setColorAt(k, new THREE.Color().setRGB(0.13 + t[3] * 0.06, 0.24 + t[3] * 0.08, 0.18 + t[3] * 0.05)));
const caps = new THREE.InstancedMesh(capGeo, new THREE.MeshLambertMaterial({ color: 0xf1f4f8 }), treeSpots.length);
const houseGeo = new THREE.BoxGeometry(1, 1, 1); houseGeo.translate(0, 0.5, 0);
const roofGeo = new THREE.CylinderGeometry(0, 0.7072, 0.45, 4, 1); roofGeo.rotateY(Math.PI / 4); roofGeo.translate(0, 1 + 0.225, 0);   // pyramid roof sitting on a unit box
const houses = new THREE.InstancedMesh(houseGeo, new THREE.MeshLambertMaterial({ color: 0xe9e0cc }), houseSpots.length);
const roofs = new THREE.InstancedMesh(roofGeo, new THREE.MeshLambertMaterial({}), houseSpots.length);
houseSpots.forEach((h, k) => roofs.setColorAt(k, new THREE.Color(rnd() < .8 ? 0xf3f5f8 : 0x8a8f99)));   // snow on most roofs
const towerGeo = new THREE.BoxGeometry(2, 7, 2); towerGeo.translate(0, 3.5, 0); const spireGeo = new THREE.ConeGeometry(1.5, 4, 4); spireGeo.rotateY(Math.PI / 4); spireGeo.translate(0, 9, 0);
const towers = new THREE.InstancedMesh(towerGeo, new THREE.MeshLambertMaterial({ color: 0xd8cdb4 }), churches.length);
const spires = new THREE.InstancedMesh(spireGeo, new THREE.MeshLambertMaterial({ color: 0x4f5a5c }), churches.length);
props.add(trees, caps, houses, roofs, towers, spires);
const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), v3 = new THREE.Vector3(), sc = new THREE.Vector3();
function placeProps(z) {
  const k = Math.min(1, z / 2 + 0.25);                                        // props shrink with the relief, so a flat board is not a forest of spikes
  treeSpots.forEach((t, i) => { m4.compose(v3.set(t[0] - CX, hAt(t[0], t[1]) * z - 0.3, t[1] - CY), q.identity(), sc.setScalar(t[2] * k)); trees.setMatrixAt(i, m4); caps.setMatrixAt(i, m4); });
  const s = Math.max(k, 0.6);                                                 // buildings stay readable even on a flat board
  houseSpots.forEach((h, i) => { const r = 1.6, g = Math.min(hAt(h[0] - r, h[1] - r), hAt(h[0] + r, h[1] - r), hAt(h[0] - r, h[1] + r), hAt(h[0] + r, h[1] + r)); m4.compose(v3.set(h[0] - CX, g * z - 0.2, h[1] - CY), q.setFromEuler(e.set(0, h[2], 0)), sc.set(h[3], h[4] * s, h[5])); houses.setMatrixAt(i, m4); roofs.setMatrixAt(i, m4); });
  churches.forEach((c, i) => { m4.compose(v3.set(c[0] - CX, hAt(c[0], c[1]) * z - 0.2, c[1] - CY), q.identity(), sc.set(c[2], c[2] * s, c[2])); towers.setMatrixAt(i, m4); spires.setMatrixAt(i, m4); });
  for (const o of [trees, caps, houses, roofs, towers, spires]) o.instanceMatrix.needsUpdate = true;
}

// game layer: a few blocks, as in the app
const AREA = Object.fromEntries(D.areas.map((a) => [a.id, a]));
const labelTex = (t, bg, fg) => { const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d'); x.fillStyle = bg; x.fillRect(0, 0, 128, 128); x.fillStyle = fg; x.font = '700 40px Saira Condensed, Arial Narrow, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(t, 64, 66); x.strokeStyle = '#0006'; x.lineWidth = 6; x.strokeRect(3, 3, 122, 122); return new THREE.CanvasTexture(c); };
const BLOCKS = [['106 Inf', 'allied', 23, -62, 30], ['7 Arm', 'allied', 24, 0, -40], ['30 Inf', 'allied', 33, -62, 22], ['3 FJ', 'german', 10, 0, -40], ['18 VG', 'german', 11, -14, -40], ['1 SS', 'german', 9, -8, -40]];
window.blocks = BLOCKS.map(([name, side, area, dx, dy]) => {
  const col = side === 'german' ? 0xb9bcc0 : 0x9db36a, top = labelTex(name, side === 'german' ? '#c9ccd0' : '#a9c077', '#1b1e14'), side_ = new THREE.MeshLambertMaterial({ color: col });
  const m = new THREE.Mesh(new THREE.BoxGeometry(17, 10, 17), [side_, side_, new THREE.MeshLambertMaterial({ map: top }), side_, side_, side_]);
  const a = AREA[area]; m.userData = { name, area, x: a.label[0] + dx, y: a.label[1] + dy }; scene.add(m); return m; });
function placeBlocks(z) { for (const b of window.blocks) { const { x, y } = b.userData; let h = 0; for (const [ox, oy] of [[0, 0], [-8, -8], [8, -8], [-8, 8], [8, 8]]) h = Math.max(h, hAt(x + ox, y + oy)); b.position.set(x - CX, h * z + 5, y - CY); } }

// move options for 106 Inf from St. Vith: green = can go on, orange = must stop (river crossing)
const MOVES = { go: [10, 22, 24], stop: [11, 12, 25] };
(function drawHl() { const x = hlCv.getContext('2d'); x.setTransform(2, 0, 0, 2, -X0 * 2, -Y0 * 2);
  const poly = (a) => { x.beginPath(); a.poly.forEach(([px, py], i) => (i ? x.lineTo(px, py) : x.moveTo(px, py))); x.closePath(); };
  const lit = (id, fill, edge) => { poly(AREA[id]); x.fillStyle = fill; x.fill(); x.save(); x.clip(); x.lineWidth = 7; x.lineJoin = 'round'; x.strokeStyle = edge; x.stroke(); x.restore(); };   // the edge is drawn inside the area only, so neighbours never bleed
  for (const id of MOVES.go) lit(id, 'rgba(95,211,90,.42)', 'rgba(70,190,70,.95)');
  for (const id of MOVES.stop) lit(id, 'rgba(240,160,48,.42)', 'rgba(235,140,30,.95)');
  poly(AREA[23]); x.save(); x.clip(); x.lineWidth = 10; x.strokeStyle = 'rgba(255,214,90,1)'; x.stroke(); x.restore();   // the block's own area: a bright gold edge, no fill
  hlTex.needsUpdate = true; })();

// the contour look's ground: the low-poly winter colours as a soft map (fields white, woods pale green, towns grey), draped on the relief
U.tF.value = (() => {
  const cv = document.createElement('canvas'); cv.width = C; cv.height = R; const x = cv.getContext('2d'), im = x.createImageData(C, R);
  for (let j = 0; j < R; j++) for (let i = 0; i < C; i++) { const X = X0 + i * ST, Y = Y0 + j * ST, w = (FL[j * C + i] >> 2) / 63, c = paved(X, Y) ? [200, 202, 206] : w > 0.45 ? [158, 186, 168] : [241, 244, 248], o = (j * C + i) * 4;
    im.data[o] = c[0]; im.data[o + 1] = c[1]; im.data[o + 2] = c[2]; im.data[o + 3] = 255; }
  x.putImageData(im, 0, 0);
  const big = document.createElement('canvas'); big.width = C * 4; big.height = R * 4; const bx = big.getContext('2d'); bx.filter = 'blur(4px)'; bx.drawImage(cv, 0, 0, big.width, big.height);   // soft edges, no pixel steps
  return new THREE.CanvasTexture(big);
})();

// state and controls
const S = { look: 1, cont: true, step: 3, z: 4, props: true, flat: true, choosing: false, zNow: 4 };
const bar = document.getElementById('bar'), hint = document.getElementById('hint'), more = document.getElementById('more');
more.addEventListener('click', () => { const o = bar.classList.toggle('open'); more.setAttribute('aria-expanded', String(o)); resize(); });
const seg = (id, f) => document.getElementById(id).addEventListener('click', (ev) => { const b = ev.target.closest('button'); if (!b) return; for (const o of b.parentNode.children) o.setAttribute('aria-pressed', String(o === b)); f(+b.dataset.v); });
seg('look', (v) => { const was = S.look; S.look = v; U.uMode.value = v; if ((was === 2) !== (v === 2)) buildTerrain(v === 2 ? 1 : S.step, v === 2); treeVis(); });
seg('fac', (v) => { S.step = v; if (S.look !== 2) buildTerrain(v); });
const zIn = document.getElementById('z'), zOut = document.getElementById('zv');
zIn.addEventListener('input', () => { S.z = +zIn.value; zOut.textContent = S.z ? '×' + S.z : 'flat'; });
const tog = (id, k, f) => { const b = document.getElementById(id); b.addEventListener('click', () => { S[k] = !S[k]; b.setAttribute('aria-pressed', String(S[k])); f && f(); }); };
const treeVis = () => { trees.visible = caps.visible = S.props; };
tog('trees', 'props', treeVis);
tog('cont', 'cont', () => { U.uCont.value = S.cont ? 1 : 0; });
tog('flat', 'flat');
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(); let down = null;
canvas.addEventListener('pointerdown', (ev) => { down = [ev.clientX, ev.clientY]; });
canvas.addEventListener('pointerup', (ev) => { if (!down || Math.hypot(ev.clientX - down[0], ev.clientY - down[1]) > 6) return; const r = canvas.getBoundingClientRect();
  ndc.set((ev.clientX - r.left) / r.width * 2 - 1, -(ev.clientY - r.top) / r.height * 2 + 1); ray.setFromCamera(ndc, cam);
  const hit = ray.intersectObjects(window.blocks)[0]; S.choosing = !!hit && hit.object.userData.name === '106 Inf' && !S.choosing;
  hint.innerHTML = S.choosing ? '<b>Green</b>: can move on · <b>Orange</b>: must stop (river) · tap anywhere to cancel' : 'Tap the green <b>106 Inf</b> block in St. Vith to see its moves'; });

function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); document.documentElement.style.setProperty('--barh', bar.offsetHeight + 'px'); document.documentElement.style.setProperty('--pb', document.querySelector('.plate').getBoundingClientRect().bottom + 8 + 'px'); }
addEventListener('resize', resize); resize();
const phone = innerWidth < 600; cam.position.set(phone ? 10 : -20, phone ? 640 : 340, phone ? 480 : 360); ctl.target.set(phone ? 10 : -10, 0, phone ? 30 : 30); ctl.update();
buildTerrain(S.step); placeProps(S.z); placeBlocks(S.z);
let last = -1, lastP = -1;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
(function loop() {
  const want = S.choosing && S.flat ? S.z * 0.2 : S.z;                       // flatten while choosing: the relief settles so the lit areas read clearly
  S.zNow += reduce ? want - S.zNow : (want - S.zNow) * 0.12; if (Math.abs(want - S.zNow) < 0.002) S.zNow = want;
  U.uZ.value = S.zNow; U.uHl.value += ((S.choosing ? 1 : 0) - U.uHl.value) * (reduce ? 1 : 0.15);
  if (Math.abs(S.zNow - last) > 1e-4) { placeBlocks(S.zNow); last = S.zNow; }
  if (Math.abs(S.zNow - lastP) > 0.02) { placeProps(S.zNow); lastP = S.zNow; }
  ctl.update(); renderer.render(scene, cam); requestAnimationFrame(loop);
})();
</script>
