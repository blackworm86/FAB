<title>FAB Map Checker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: full-height workbench. Map viewport left, review panel right (stacks under the map on phones). */
:root {
  --bg: #eef0ee; --panel: #fbfbf9; --panel-2: #f1f2ef; --line: #cfd3cc; --fg: #1d2420; --muted: #5d675f;
  --accent: #c2410c; --accent-fg: #ffffff; --ok: #1a7f4b; --bad: #c0262d; --warn: #9a6700;
  --z5: #d99a00; --z6: #d6363d; --z7: #2a9d63; --sel: #0a84ff;
  --ui: "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131714; --panel: #1b201c; --panel-2: #232924; --line: #343b35; --fg: #e8ece6; --muted: #9aa59c;
  --accent: #ff9248; --accent-fg: #1b1006; --ok: #4cc38a; --bad: #ff6b72; --warn: #e5b53b;
  --z5: #f0b429; --z6: #ff5a60; --z7: #3ecf8e; --sel: #4aa3ff; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #131714; --panel: #1b201c; --panel-2: #232924; --line: #343b35; --fg: #e8ece6; --muted: #9aa59c;
  --accent: #ff9248; --accent-fg: #1b1006; --ok: #4cc38a; --bad: #ff6b72; --warn: #e5b53b;
  --z5: #f0b429; --z6: #ff5a60; --z7: #3ecf8e; --sel: #4aa3ff; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 15px; margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 360px; padding-left: max(0px, env(safe-area-inset-left, 0px)); padding-right: max(0px, env(safe-area-inset-right, 0px)); }
.stage { position: relative; min-width: 0; min-height: 0; background: #0c0f0d; overflow: hidden; }
#svg { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
#svg.dragging { cursor: grabbing; }
#svg.adding { cursor: crosshair; }
.bar { position: absolute; left: 10px; right: 10px; top: 10px; display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
.bar > * { pointer-events: auto; }
.chip { background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(6px); }
.chip[hidden] { display: none; }
.chip input[type=search] { width: 150px; background: transparent; border: 0; outline: 0; }
.zoom { position: absolute; right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
.zoom button { width: 36px; height: 36px; }
.readout { position: absolute; left: 10px; bottom: 10px; font-family: var(--mono); font-size: 12px; background: color-mix(in srgb, var(--panel) 92%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; max-width: calc(100% - 70px); }
.panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; padding: 11px 6px; background: none; border: 0; border-bottom: 3px solid transparent; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 12.5px; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected=true] { color: var(--fg); border-bottom-color: var(--accent); }
.pane { padding: 14px 16px 20px; overflow: auto; flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
h2 { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 6px; font-weight: 600; }
h3 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.15; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 600; }
.btn.on { outline: 2px solid var(--accent); outline-offset: -2px; }
.btn.danger { color: var(--bad); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; background: var(--panel-2); padding: 6px 14px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed=true] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.kv { display: grid; grid-template-columns: 92px 1fr; gap: 6px 10px; align-items: center; }
.kv label { color: var(--muted); font-size: 13px; }
input[type=number], select, textarea, input[type=text] { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; width: 100%; }
textarea { min-height: 70px; resize: vertical; }
.layers { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.layers label { display: flex; gap: 8px; align-items: center; cursor: pointer; font-size: 14px; }
.sw { width: 22px; height: 0; display: inline-block; flex: none; }
.legend { display: grid; gap: 7px; font-size: 13.5px; }
.legend div { display: flex; align-items: center; gap: 10px; }
.legend svg { flex: none; }
.list { display: flex; flex-direction: column; gap: 2px; }
.item { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 6px; cursor: pointer; background: none; border: 0; text-align: left; width: 100%; }
.item:hover { background: var(--panel-2); }
.tag { font-family: var(--mono); font-size: 11.5px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); flex: none; }
.pass { color: var(--ok); border-color: var(--ok); } .fail { color: var(--bad); border-color: var(--bad); } .flag { color: var(--warn); border-color: var(--warn); }
.nb { display: flex; gap: 6px; flex-wrap: wrap; }
.nb button { font-family: var(--mono); font-size: 12.5px; padding: 3px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel-2); cursor: pointer; }
.hint { font-size: 13px; color: var(--muted); line-height: 1.4; }
#out { font-family: var(--mono); font-size: 11.5px; min-height: 160px; white-space: pre; }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; grid-template-rows: minmax(0, 56%) minmax(0, 44%); padding-left: 0; padding-right: 0; }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .pane { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .bar { left: max(10px, env(safe-area-inset-left, 0px)); }
  .chip input[type=search] { width: 110px; }
}
</style>

<div class="app">
  <div class="stage" id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg" aria-label="Interactive FAB The Bulge map"></svg>
    <div class="bar">
      <div class="chip"><input id="find" type="search" placeholder="Area number or name" aria-label="Find area" list="areas-dl"><datalist id="areas-dl"></datalist></div>
      <div class="chip seg" style="padding:0" role="group" aria-label="Tool">
        <button id="t-sel" aria-pressed="true">Inspect</button><button id="t-add" aria-pressed="false">Add connection</button>
      </div>
      <div class="chip" id="mode-hint" hidden></div>
    </div>
    <div class="readout" id="readout">Scroll to zoom, drag to pan.</div>
    <div class="zoom"><button class="btn" id="zin" aria-label="Zoom in">+</button><button class="btn" id="zout" aria-label="Zoom out">&minus;</button><button class="btn" id="zfit" aria-label="Fit map" title="Fit">&#9635;</button></div>
  </div>
  <aside class="panel">
    <div class="tabs" role="tablist">
      <button role="tab" id="tab-sel" aria-selected="true">Selection</button>
      <button role="tab" id="tab-layers" aria-selected="false">Layers</button>
      <button role="tab" id="tab-checks" aria-selected="false">Checks</button>
      <button role="tab" id="tab-export" aria-selected="false">Export</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>
</div>

<script>
const DATA = __DATA__;
const IMG = "__IMG__";
(function () {
'use strict';
const W = DATA.width, H = DATA.height, NS = 'http://www.w3.org/2000/svg';
const $ = (s) => document.querySelector(s);
const svg = $('#svg'), pane = $('#pane');
const ZC = { 5: '#f0a500', 6: '#e5383b', 7: '#25a26a' };
const ZN = { 5: '5th Panzer Army', 6: '6th Panzer Army', 7: '7th Army' };
const clone = (o) => JSON.parse(JSON.stringify(o));
const ek = (a, b) => (a < b ? a + '-' + b : b + '-' + a);
const orig = { areas: clone(DATA.areas), edges: clone(DATA.edges) };
let areas = clone(DATA.areas), edges = clone(DATA.edges), notes = {};
const STORE = 'fab-map-checker-v1';
try { const s = JSON.parse(localStorage.getItem(STORE) || 'null'); if (s && s.areas) { areas = s.areas; edges = s.edges; notes = s.notes || {}; } } catch (e) {}

const byId = () => Object.fromEntries(areas.map((a) => [a.id, a]));
let A = byId();
const L = { image: true, imgop: 100, zones: true, outlines: true, roads: true, fields: true, ticks: true, nums: true, names: false, tdn: false, entry: true };

const nbrs = (id) => edges.filter((e) => e.a === id || e.b === id).map((e) => (e.a === id ? e.b : e.a)).sort((x, y) => x - y);

/* ---------- map drawing ---------- */
const g = {};
function build() {
  svg.innerHTML = '';
  const defs = el('defs', {}, svg);
  const pat = el('pattern', { id: 'hatch', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
  el('rect', { width: 6, height: 6, fill: '#7b3f12' }, pat); el('line', { x1: 0, y1: 0, x2: 0, y2: 6, stroke: '#f3d9b8', 'stroke-width': 2 }, pat);
  ['img', 'zones', 'outl', 'entry', 'edges', 'ticks', 'badges', 'sel'].forEach((k) => { g[k] = el('g', { id: 'g-' + k }, svg); });

function draw() {
  A = byId();
  g.img.style.display = L.image ? '' : 'none'; g.img.style.opacity = L.imgop / 100;
  ['zones', 'outl', 'entry', 'edges', 'ticks', 'badges', 'sel'].forEach((k) => (g[k].innerHTML = ''));

  if (L.entry) for (const [letter, en] of Object.entries(DATA.entry)) {
    const r = en.rects[0], cx = r[0] + (r[2] - r[0]) / 2, cy = r[1] + (r[3] - r[1]) / 2, p = pos(en.area);

    el('circle', { cx, cy, r: 15 * k, fill: en.side === 'german' ? '#5f7f9c' : '#2f8f57', stroke: '#fff', 'stroke-width': 2 * k }, g.entry);
    const t = el('text', { x: cx, y: cy + 7 * k, 'text-anchor': 'middle', 'font-size': 19 * k, 'font-weight': 700, fill: '#fff', 'font-family': 'IBM Plex Mono, monospace' }, g.entry);

    const pa = pos(e.a), pb = pos(e.b), m = e.mid || [(pa[0] + pb[0]) / 2, (pa[1] + pb[1]) / 2];
    const road = e.connection === 'road';
    if ((road && !L.roads) || (!road && !L.fields)) continue;
    const pts = pa[0] + ',' + pa[1] + ' ' + m[0] + ',' + m[1] + ' ' + pb[0] + ',' + pb[1];
    const key = ek(e.a, e.b), isSel = sel && sel.type === 'edge' && sel.key === key;
    el('polyline', { points: pts, fill: 'none', stroke: '#fff', 'stroke-opacity': 0.75, 'stroke-width': (road ? 7 : 5) * k, 'stroke-linejoin': 'round' }, g.edges);
    el('polyline', { points: pts, fill: 'none', stroke: road ? '#141414' : '#46505a', 'stroke-width': (road ? 3.6 : 2) * k, 'stroke-dasharray': road ? '' : (7 * k) + ' ' + (5 * k), 'stroke-linejoin': 'round' }, g.edges);
    if (isSel) el('polyline', { points: pts, fill: 'none', stroke: '#0a84ff', 'stroke-opacity': 0.55, 'stroke-width': 14 * k, 'stroke-linejoin': 'round' }, g.sel);
    const hit = el('polyline', { points: pts, fill: 'none', stroke: 'transparent', 'stroke-width': 18 * k, 'data-edge': key, 'stroke-linejoin': 'round' }, g.edges); hit.style.cursor = 'pointer';
    if (L.ticks) {
      const dx = pb[0] - pa[0], dy = pb[1] - pa[1], n = Math.hypot(dx, dy) || 1, px = -dy / n, py = dx / n, hl = 24 * k;
      const x1 = m[0] + px * hl, y1 = m[1] + py * hl, x2 = m[0] - px * hl, y2 = m[1] - py * hl;
      const army = isArmy(e);
      const tick = (col, w, dash, halo) => { if (halo) el('line', { x1, y1, x2, y2, stroke: '#fff', 'stroke-width': (w + 3) * k, 'stroke-opacity': .85, 'stroke-linecap': 'butt' }, g.ticks); el('line', { x1, y1, x2, y2, stroke: col, 'stroke-width': w * k, 'stroke-dasharray': dash, 'stroke-linecap': 'butt' }, g.ticks); };

      if (army) { const o = 7 * k; el('line', { x1: x1 + px * 0, y1, x2, y2, stroke: '#ff2bd6', 'stroke-width': 3.2 * k, 'stroke-dasharray': (6 * k) + ' ' + (4 * k), transform: 'translate(' + (dx / n * o) + ',' + (dy / n * o) + ')' }, g.ticks); }
    }
    el('circle', { cx: m[0], cy: m[1], r: 5 * k, fill: road ? '#141414' : '#9aa5b1', stroke: '#fff', 'stroke-width': 1.5 * k, 'pointer-events': 'none' }, g.ticks);
    if (e.manual) el('circle', { cx: m[0], cy: m[1], r: 11 * k, fill: 'none', stroke: '#ffd400', 'stroke-width': 2 * k, 'pointer-events': 'none' }, g.ticks);
    if (notes['e' + key]) el('circle', { cx: m[0] + 10 * k, cy: m[1] - 10 * k, r: 4 * k, fill: '#ff3b30', stroke: '#fff', 'stroke-width': 1 * k, 'pointer-events': 'none' }, g.ticks);
  }
  for (const a of areas) {
    const p = a.seed, isSel = sel && sel.type === 'area' && sel.id === a.id, r = 13 * k;
    const bg = el('g', { 'data-area': a.id, transform: 'translate(' + p[0] + ',' + p[1] + ')' }, g.badges); bg.style.cursor = 'pointer';
    if (addFrom === a.id) el('circle', { r: r + 9 * k, fill: 'none', stroke: '#ffd400', 'stroke-width': 3 * k }, bg);
    if (isSel) el('circle', { r: r + 7 * k, fill: 'none', stroke: '#0a84ff', 'stroke-width': 3.5 * k }, bg);
    if (L.nums) {
      el('circle', { r, fill: ZC[a.zone], stroke: '#fff', 'stroke-width': 2 * k }, bg);
      const t = el('text', { 'text-anchor': 'middle', y: 4.6 * k, 'font-size': 13.5 * k, 'font-weight': 700, fill: '#fff', stroke: 'rgba(0,0,0,.55)', 'stroke-width': 2.6 * k, 'paint-order': 'stroke', 'font-family': 'IBM Plex Mono, monospace' }, bg); t.textContent = a.id;
      if (notes['a' + a.id]) el('circle', { cx: r * .8, cy: -r * .8, r: 4.5 * k, fill: '#ff3b30', stroke: '#fff', 'stroke-width': 1 * k }, bg);
    }
    const lines = [];
    if (L.names) lines.push(a.name);
    if (L.tdn) lines.push('TDN ' + a.tdn + (a.vp.allied ? '  A' + a.vp.allied : '') + (a.vp.german ? '  G' + a.vp.german : '') + (a.vp.mutual ? '  ★' : ''));
    lines.forEach((s, i) => {
      const t = el('text', { 'text-anchor': 'middle', y: r + (14 + i * 14) * k, 'font-size': 12.5 * k, 'font-weight': 600, fill: '#fff', stroke: '#000', 'stroke-width': 3.4 * k, 'paint-order': 'stroke', 'font-family': 'Barlow Semi Condensed, sans-serif' }, bg); t.textContent = s;
    });
  }

}
function applyView() { const h = view.w * H / W; svg.setAttribute('viewBox', view.x + ' ' + view.y + ' ' + view.w + ' ' + h); }
function fit() { const r = svg.getBoundingClientRect(); const ar = r.width / Math.max(1, r.height); view.w = Math.max(W, H * ar); view.x = (W - view.w) / 2; const vh = view.w * H / W; view.y = 0; draw(); fixAspect(); }

function zoomAt(cx, cy, f) {

svg.addEventListener('pointermove', (ev) => { if (!ptrs.has(ev.pointerId)) { hover(ev); return; } ptrs.set(ev.pointerId, [ev.clientX, ev.clientY]);

svg.addEventListener('wheel', (ev) => { ev.preventDefault(); zoomAt(ev.clientX, ev.clientY, Math.exp(ev.deltaY * 0.0015)); }, { passive: false });
function target(ev) { const t = document.elementFromPoint(ev.clientX, ev.clientY); if (!t) return {}; const n = t.closest('[data-area]'), e = t.closest('[data-edge]'); return { area: n && n.getAttribute('data-area'), edge: e && e.getAttribute('data-edge'), badge: n && n.tagName === 'g' }; }
function clickAt(ev) {
  const t = target(ev);
  if (tool === 'add') {
    if (t.area) { const id = +t.area;
      if (addFrom == null) addFrom = id;
      else if (addFrom !== id) { const key = ek(addFrom, id); if (!edges.some((e) => ek(e.a, e.b) === key)) { const a = Math.min(addFrom, id), b = Math.max(addFrom, id), pa = pos(a), pb = pos(b);
          edges.push({ a, b, connection: 'field', river: false, restricted: false, manual: true, mid: [(pa[0] + pb[0]) / 2, (pa[1] + pb[1]) / 2] }); save(); }
        sel = { type: 'edge', key }; addFrom = null; setTool('sel'); tab = 'sel'; }

    return; }

const TESTS = {

  TESTS.field.forEach(([a, b]) => { const e = E(a, b); out.push({ k: ek(a, b), t: 'Field ' + a + ' – ' + b, ok: !!e && e.connection === 'field', src: 'play-book example' }); });

function diff() {
  const ch = [];
  for (const a of areas) { const o = orig.areas.find((x) => x.id === a.id); const f = [];
    if (o.zone !== a.zone) f.push('zone ' + o.zone + '→' + a.zone); if (o.tdn !== a.tdn) f.push('TDN ' + o.tdn + '→' + a.tdn);
    if (o.vp.allied !== a.vp.allied) f.push('allied VP ' + o.vp.allied + '→' + a.vp.allied); if (o.vp.german !== a.vp.german) f.push('german VP ' + o.vp.german + '→' + a.vp.german); if (o.vp.mutual !== a.vp.mutual) f.push('mutual star ' + o.vp.mutual + '→' + a.vp.mutual);
    if (f.length) ch.push({ what: 'area ' + a.id + ' ' + a.name, change: f.join(', ') }); }
  const om = new Map(orig.edges.map((e) => [ek(e.a, e.b), e])), cm = new Map(edges.map((e) => [ek(e.a, e.b), e]));
  for (const [k, e] of cm) { const o = om.get(k); if (!o) { ch.push({ what: 'connection ' + k, change: 'added as ' + e.connection + (e.river ? ' + river' : '') + (e.restricted ? ' + restricted' : '') }); continue; }
    const f = []; if (o.connection !== e.connection) f.push(o.connection + '→' + e.connection); if (!!o.river !== !!e.river) f.push('river ' + !!o.river + '→' + !!e.river); if (!!o.restricted !== !!e.restricted) f.push('restricted ' + !!o.restricted + '→' + !!e.restricted);
    if (f.length) ch.push({ what: 'connection ' + k, change: f.join(', ') }); }
  for (const k of om.keys()) if (!cm.has(k)) ch.push({ what: 'connection ' + k, change: 'removed' });

}
function exportJson() {
