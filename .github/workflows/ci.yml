name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pkg: [engine, web]
    defaults:
      run:
        working-directory: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.pkg }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
  database-rules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/rules-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/rules-test/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('tools/rules-test/package-lock.json') }}
      - run: npm ci
      - run: npm test
  browser-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run assets
      - name: Start the dev server
        run: |
          nohup npx vite --port 5199 > vite.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5199/ > /dev/null && break; sleep 2; done
      - run: npm run e2e
      - if: failure()
        run: tail -50 vite.log
