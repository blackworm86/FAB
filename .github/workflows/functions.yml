name: referee
# Deploys the Cloud Functions referee (and the Firestore rules) to Firebase. Needs the repository secret FIREBASE_SERVICE_ACCOUNT
# and the repository variable VITE_FIREBASE_PROJECT_ID; see docs/DEPLOY.md.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['functions/**', 'engine/src/**', 'data/**', 'firestore.rules', 'firebase.json']
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && vars.VITE_FIREBASE_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: env.HAS_KEY == 'true'
        with:
          node-version: 20
      - uses: google-github-actions/auth@v2
        if: env.HAS_KEY == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - if: env.HAS_KEY == 'true'
        run: npx --yes firebase-tools@13 deploy --only functions,firestore:rules --project ${{ vars.VITE_FIREBASE_PROJECT_ID }} --non-interactive
