<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 330" width="520" height="330">
  <rect width="520" height="330" fill="#fff"/>
  <text x="30" y="34" font-family="Arial" font-weight="700" font-size="15">Reusable Special Action blocks (8.1): label art for the wooden blocks. Draw inside each square (group "art-..."); delete the notes when done.</text>
  <g id="SA-german">
    <g id="art-SA-german"><rect x="30" y="60" width="200" height="200" rx="6" fill="#b7bbc1" stroke="#999" stroke-dasharray="6 4"/></g>
    <g id="notes-SA-german" font-family="Arial">
      <text x="30" y="282" font-weight="700" font-size="14">German Special Action [SA-german]</text>
      <text x="30" y="300" font-size="11" fill="#555">Block label, 16 x 16 mm. German block colour (grey wood).</text>
      <text x="30" y="314" font-size="11" fill="#555">Arrives turn 2; returns to Available each Reinforcement Phase.</text>
    </g>
  </g>
  <g id="SA-allied">
    <g id="art-SA-allied"><rect x="290" y="60" width="200" height="200" rx="6" fill="#8fa83f" stroke="#999" stroke-dasharray="6 4"/></g>
    <g id="notes-SA-allied" font-family="Arial">
      <text x="290" y="282" font-weight="700" font-size="14">Allied Special Action [SA-allied]</text>
      <text x="290" y="300" font-size="11" fill="#555">Block label, 16 x 16 mm. Allied block colour (green wood).</text>
      <text x="290" y="314" font-size="11" fill="#555">Convert text to outlines before sending.</text>
    </g>
  </g>
</svg>
