<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 860" width="860" height="860">
<rect width="860" height="860" fill="#fff"/>
<text x="30" y="34" font-family="Arial" font-weight="700" font-size="15">Single-use Special Action events (17.33): cardboard counters, to match the reusable Special Action blocks.</text>
<text x="30" y="54" font-family="Arial" font-size="12" fill="#555">Draw inside each square (group "art-...").</text><text x="30" y="70" font-family="Arial" font-size="12" fill="#555">The band is the Higher Echelon colour; the turn number goes top-left. Delete the notes when done; convert text to outlines.</text>
<g id="SAE-de_5pz-t3"><g id="art-SAE-de_5pz-t3"><rect x="30" y="90" width="200" height="200" rx="8" fill="#b7bbc1" stroke="#999" stroke-dasharray="6 4"/><rect x="30" y="260" width="200" height="30" fill="#d6d8db" opacity=".85"/><text x="40" y="120" font-family="Arial" font-weight="700" font-size="24" fill="#222">3</text></g>
<g id="notes-SAE-de_5pz-t3" font-family="Arial"><text x="30" y="312" font-weight="700" font-size="12">Special Action, German 5th Panzer Army</text><text x="30" y="330" font-size="11" fill="#555">[SAE-de_5pz-t3] arrives turn 3; 2 in the game</text><text x="30" y="346" font-size="11" fill="#555">Single use, units of this Higher Echelon only;</text><text x="30" y="360" font-size="11" fill="#555">then to the Eliminated Box. Uses: 8.21-8.27.</text><text x="30" y="374" font-size="11" fill="#555">Echelon colour #d6d8db</text></g></g>
<g id="SAE-de_6pz-t4"><g id="art-SAE-de_6pz-t4"><rect x="280" y="90" width="200" height="200" rx="8" fill="#b7bbc1" stroke="#999" stroke-dasharray="6 4"/><rect x="280" y="260" width="200" height="30" fill="#8e2d82" opacity=".85"/><text x="290" y="120" font-family="Arial" font-weight="700" font-size="24" fill="#222">4</text></g>
<g id="notes-SAE-de_6pz-t4" font-family="Arial"><text x="280" y="312" font-weight="700" font-size="12">Special Action, German 6th Panzer Army</text><text x="280" y="330" font-size="11" fill="#555">[SAE-de_6pz-t4] arrives turn 4; 1 in the game</text><text x="280" y="346" font-size="11" fill="#555">Single use, units of this Higher Echelon only;</text><text x="280" y="360" font-size="11" fill="#555">then to the Eliminated Box. Uses: 8.21-8.27.</text><text x="280" y="374" font-size="11" fill="#555">Echelon colour #8e2d82</text></g></g>
